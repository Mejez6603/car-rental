<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Fleet Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css"> </head>
<body>

<div id="car-trigger">
    <img src="https://cdn-icons-png.flaticon.com/512/744/744465.png" width="40" height="40">
</div>

<div id="details-panel">
    <h2 id="ui-header"><span id="ui-dot" class="status-dot"></span>Car-001 (Montero Sport)</h2>
    <div id="ui-privacy-badge" class="privacy-badge" style="background:#d4edda; color:#155724;">Security: Decrypted (Live)</div>
    <div class="data-row">Satellites: <span id="ui-sats" class="data-value">--</span></div>
    <div class="data-row">Latitude: <span id="ui-lat" class="data-value">--</span></div>
    <div class="data-row">Longitude: <span id="ui-lng" class="data-value">--</span></div>
    <button id="locate-btn" class="locate-btn">Center Map on Car</button>
    <button id="override-btn" class="override-btn" onclick="toggleOverride()" style="background-color:#475569; color:white;">🔒 Mask Location</button>
</div>

<div id="car-trigger-2">
    <img src="https://cdn-icons-png.flaticon.com/512/744/744465.png" width="40" height="40">
</div>

<div id="details-panel-2">
    <h2 id="ui-header-2"><span id="ui-dot-2" class="status-dot"></span>Car-002</h2>
    <div id="ui-privacy-badge-2" class="privacy-badge" style="background:#d4edda; color:#155724;">Security: Decrypted (Live)</div>
    <div class="data-row">Satellites: <span id="ui-sats-2" class="data-value">--</span></div>
    <div class="data-row">Latitude: <span id="ui-lat-2" class="data-value">--</span></div>
    <div class="data-row">Longitude: <span id="ui-lng-2" class="data-value">--</span></div>
    <button id="locate-btn-2" class="locate-btn">Center Map on Car</button>
    <button id="override-btn-2" class="override-btn" onclick="toggleOverride2()" style="background-color:#475569; color:white;">🔒 Mask Location</button>
</div>

<div id="fleet-bar">
    <div class="fleet-status">
        <span class="fleet-dot"></span>
        <span id="fleet-count-text">Fleet Radar: Checking...</span>
    </div>
    <button id="view-all-btn" onclick="fitAllDevices()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        View All Devices
    </button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script> </body>
</html>
