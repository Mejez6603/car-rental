<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Fleet Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css"> </head>
<body>

<div id="car-trigger">
    <img src="https://cdn-icons-png.flaticon.com/512/744/744465.png" width="40" height="40">
</div>

<div id="details-panel">
    <h2 id="ui-header"><span id="ui-dot" class="status-dot"></span>Car-001</h2>
    <div id="ui-privacy-badge">Security: Encrypted</div>
    <div class="data-row">Satellites: <span id="ui-sats" class="data-value">--</span></div>
    <div class="data-row">Latitude: <span id="ui-lat" class="data-value">--</span></div>
    <div class="data-row">Longitude: <span id="ui-lng" class="data-value">--</span></div>
    <button id="locate-btn">Center Map on Car</button>
    <button id="override-btn" onclick="toggleOverride()">🔓 Decrypt Car Location</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script> </body>
</html>
